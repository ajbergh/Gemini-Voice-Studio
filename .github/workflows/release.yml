name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            extension: ""
          - runner: macos-13
            goos: darwin
            goarch: amd64
            extension: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Embed frontend
        shell: bash
        run: |
          rm -rf backend/internal/embed/dist
          mkdir -p backend/internal/embed/dist
          cp -R dist/. backend/internal/embed/dist/
      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          mkdir -p release
          cd backend
          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/ajbergh/gemini-voice-gen-tts/backend/internal/buildinfo.Version=${VERSION} \
              -X github.com/ajbergh/gemini-voice-gen-tts/backend/internal/buildinfo.Commit=${COMMIT_SHA} \
              -X github.com/ajbergh/gemini-voice-gen-tts/backend/internal/buildinfo.Date=${BUILD_DATE}" \
            -o "../release/gemini-voice-studio-${GOOS}-${GOARCH}${{ matrix.extension }}" \
            ./cmd/server
      - uses: actions/upload-artifact@v7
        with:
          name: gemini-voice-studio-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
