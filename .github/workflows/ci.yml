name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: output/
          if-no-files-found: ignore

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Go vet
        shell: bash
        run: |
          set +e
          mkdir -p ../output/backend
          go vet ./... > ../output/backend/vet.log 2>&1
          status=$?
          cat ../output/backend/vet.log
          exit $status
      - name: Go tests
        shell: bash
        run: |
          set +e
          go test ./... > ../output/backend/test.log 2>&1
          status=$?
          cat ../output/backend/test.log
          exit $status
      - name: Race tests
        shell: bash
        run: |
          set +e
          go test -race ./... > ../output/backend/race.log 2>&1
          status=$?
          cat ../output/backend/race.log
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: output/backend/
          if-no-files-found: ignore

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gemini-voice-studio:ci
          build-args: |
            VERSION=ci
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
