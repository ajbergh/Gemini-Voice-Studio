services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - app-data:/home/app/data
    environment:
      GVS_HOST: 0.0.0.0
      GVS_PASSPHRASE: ${GVS_PASSPHRASE:-}
      GVS_LOG_LEVEL: ${GVS_LOG_LEVEL:-info}
      GVS_OPEN_BROWSER: "false"
    restart: unless-stopped

volumes:
  app-data:
